<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir ke Telegram</title>
    <style>
        /* Mengatur dasar halaman agar konten berada di tengah */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        /* Kotak Pembungkus Formulir */
        .form-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }
        .form-container h2 {
            color: #333333;
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
            font-weight: 600;
        }
        /* Mengatur jarak antar input */
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #666;
            font-size: 14px;
            font-weight: 500;
        }
        /* Desain Kotak Input */
        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cdd5e0;
            border-radius: 8px;
            font-size: 15px;
            background-color: #f9fbfe;
            transition: all 0.3s ease;
            outline: none;
            font-family: inherit;
        }
        input:focus, textarea:focus {
            border-color: #0088cc;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 136, 204, 0.15);
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        /* Desain Tombol Kirim */
        button {
            width: 100%;
            padding: 14px;
            background-color: #0088cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            margin-top: 10px;
        }
        button:hover {
            background-color: #006699;
        }
        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Hubungi Kami</h2>
    <form id="telegramForm">
        <div class="input-group">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" placeholder="Masukkan nama Anda" required>
        </div>
        
        <div class="input-group">
            <label for="email">Alamat Email</label>
            <input type="email" id="email" placeholder="nama@email.com" required>
        </div>
        
        <div class="input-group">
            <label for="pesan">Pesan</label>
            <textarea id="pesan" placeholder="Tulis pesan Anda di sini..." required></textarea>
        </div>
        
        <button type="submit">Kirim Pesan</button>
    </form>
</div>

<script>
document.getElementById('telegramForm').addEventListener('submit', function(e) {
    e.preventDefault();

    // Data Kredensial Telegram Anda
    const TOKEN = '8891349850:AAHMUYdHML5KF-dZ-1WbE6flly5D4nQRvAU'; 
    const CHAT_ID = '6854649794'; 

    // Mengambil teks input dari user
    const nama = document.getElementById('nama').value;
    const email = document.getElementById('email').value; 
    const pesan = document.getElementById('pesan').value;

    // Menyusun format teks pesan untuk Telegram
    const pesanTeks = `📩 <b>Ada Pesan Baru!</b>\n\n<b>Nama:</b> ${nama}\n<b>Email:</b> ${email}\n<b>Pesan:</b> ${pesan}`;
    const text = encodeURIComponent(pesanTeks);

    // URL API Telegram Resmi (Metode GET demi kemudahan Fetch)
    const url = `https://telegram.com{TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${text}&parse_mode=HTML`;

    fetch(url)
        .then(response => response.json())
        .then(data => {
            if (data.ok) {
                alert('Pesan berhasil dikirim ke Telegram!');
                document.getElementById('telegramForm').reset(); // Mengosongkan form
            } else {
                alert('Gagal mengirim pesan. Pastikan Anda sudah mengklik /start pada bot Telegram Anda.');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Terjadi kesalahan jaringan.');
        });
});
</script>

</body>
</html>
