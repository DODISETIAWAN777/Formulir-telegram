<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Formulir ke Telegram</title>
</head>
<body>
    <form id="telegramForm">
        <input type="text" id="nama" placeholder="Nama Anda" required><br>
        <input type="email" id="email" placeholder="Email Anda" required><br>
        <textarea id="pesan" placeholder="Pesan..." required></textarea><br>
        <button type="submit">Kirim</button>
    </form>

    <script>
        // MASUKKAN DATA ANDA DI SINI
        const TOKEN = '8891349850:AAHMUYdHML5KF-dZ-1WbE6flly5D4nQRvAU'; 
        const CHAT_ID = '6854649794'; 

        document.getElementById('telegramForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nama = document.getElementById('nama').value;
            const email = document.getElementById('email').value;
            const pesan = document.getElementById('pesan').value;

            const text = encodeURIComponent(`Formulir Baru:\nNama: ${nama}\nEmail: ${email}\nPesan: ${pesan}`);
            const url = `https://telegram.org{TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${text}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if(data.ok) {
                        alert('Pesan berhasil dikirim!');
                        document.getElementById('telegramForm').reset();
                    } else {
                        alert('Gagal mengirim pesan.');
                    }
                })
                .catch(error => console.error('Error:', error));
        });
    </script>
</body>
</html>
